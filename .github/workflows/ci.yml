name: SafetyLens verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.lock.txt
      - run: python scripts/freeze_project_metrics.py --check
      - run: python -m pytest -c backend/pytest.ini backend/tests -q
      - run: PYTHONPATH=detector/src python -m unittest discover -s detector/tests -v
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint && npm run typecheck && npm run build
        working-directory: frontend
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m venv backend/.venv && backend/.venv/bin/pip install -r backend/requirements.lock.txt
      - run: npm ci && npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: frontend/test-results
  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the documented profile on fresh volumes
        run: |
          python scripts/prepare_local_env.py --output "$RUNNER_TEMP/safetylens.env"
          python scripts/verify_clean_install.py --project safetylens-validation-ci --env-file "$RUNNER_TEMP/safetylens.env" --output "$RUNNER_TEMP/clean-install.json"
      - uses: actions/upload-artifact@v4
        with:
          name: clean-install-proof
          path: ${{ runner.temp }}/clean-install.json
