# Optional production-like database path. Supply secrets through environment/secrets management.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: safetylens
      POSTGRES_USER: safetylens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong database password}
    volumes:
      - safetylens-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safetylens"]
      interval: 5s
      retries: 10
  backend:
    environment:
      DATABASE_URL: postgresql+psycopg://safetylens:${POSTGRES_PASSWORD}@postgres/safetylens
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  safetylens-postgres:
