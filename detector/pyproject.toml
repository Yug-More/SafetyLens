[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "safetylens-detector"
version = "0.1.0"
description = "Temporal person-down detector for SafetyLens"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.3"]
video = ["mediapipe==0.10.21", "opencv-contrib-python==4.11.0.86", "numpy==1.26.4", "httpx>=0.27"]
ppe = ["onnxruntime==1.31.1", "opencv-contrib-python==4.11.0.86", "numpy==1.26.4"]
transport = ["httpx>=0.27"]

[project.scripts]
safetylens-video = "safetylens_detector.video:main"
safetylens-live = "safetylens_detector.live:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
